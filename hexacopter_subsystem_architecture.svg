<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="pwrGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="fcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rpiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="propGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="actGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Markers / Arrowheads -->
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6"/>
    </marker>

    <!-- Shadows / Filters -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect x="15" y="15" width="1170" height="730" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Main Header -->
  <g transform="translate(40, 48)">
    <circle cx="12" cy="0" r="7" fill="#38bdf8"/>
    <text x="30" y="6" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">HEXACOPTER MODULAR SUBSYSTEM ARCHITECTURE &amp; SIGNAL FLOW</text>
    <text x="30" y="24" fill="#94a3b8" font-size="12">Standardized Industrial Interconnects: MAVLink 2 (921.6k) • DShot600 • DroneCAN • 5GHz 802.11ac Video • Serial Bus Servos</text>
  </g>

  <!-- ======================================================== -->
  <!-- 1. POWER STORAGE & DISTRIBUTION (PDS)                    -->
  <!-- ======================================================== -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="320" height="340" rx="10" fill="url(#pwrGrad)" stroke="#ea580c" stroke-width="1.5"/>
    <rect width="320" height="36" rx="10" fill="#ea580c" fill-opacity="0.25"/>
    <text x="16" y="24" fill="#fdba74" font-size="14" font-weight="700">⚡ 1. POWER STORAGE &amp; DISTRIBUTION</text>

    <!-- Battery -->
    <g transform="translate(16, 50)">
      <rect width="288" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#f8fafc" font-size="12" font-weight="600">6S Solid-State Battery Pack</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">22.2V Nom (25.2V Max) • 39,000 mAh • 7C (273A)</text>
    </g>

    <!-- Smart BMS -->
    <g transform="translate(16, 110)">
      <rect width="288" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#f8fafc" font-size="12" font-weight="600">6S Smart BMS Protection Board</text>
      <text x="12" y="34" fill="#94a3b8" font-size="10">Passive Balancing • Thermal Cutoff • Over-discharge</text>
    </g>

    <!-- Holybro PM08-CAN PMU -->
    <g transform="translate(16, 164)">
      <rect width="288" height="50" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
      <text x="12" y="22" fill="#fdba74" font-size="12" font-weight="700">Holybro PM08-CAN PMU (200A)</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="10">5.2V / 3A FC Power Rail + DroneCAN Telemetry</text>
    </g>

    <!-- 5V 7A UBEC -->
    <g transform="translate(16, 226)">
      <rect width="138" height="46" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="8" y="20" fill="#f8fafc" font-size="11" font-weight="600">5V 7A Dedicated UBEC</text>
      <text x="8" y="35" fill="#38bdf8" font-size="9">5.0V Logic for RPi 5</text>
    </g>

    <!-- XL4005 Buck -->
    <g transform="translate(166, 226)">
      <rect width="138" height="46" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="8" y="20" fill="#f8fafc" font-size="11" font-weight="600">XL4005 Buck (5A)</text>
      <text x="8" y="35" fill="#f472b6" font-size="9">7.0V Rail for Servos</text>
    </g>

    <text x="16" y="310" fill="#fed7aa" font-size="11" font-weight="500">Main DC Bus: Dual XT90-S Anti-Spark (8 AWG)</text>
    <text x="16" y="326" fill="#94a3b8" font-size="10">Max Electrical Continuous Throughput: ~6.05 kW</text>
  </g>

  <!-- ======================================================== -->
  <!-- 2. PRIMARY FLIGHT CONTROL & NAVIGATION                   -->
  <!-- ======================================================== -->
  <g transform="translate(400, 95)" filter="url(#cardShadow)">
    <rect width="400" height="230" rx="10" fill="url(#fcGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="400" height="36" rx="10" fill="#0284c7" fill-opacity="0.25"/>
    <text x="16" y="24" fill="#7dd3fc" font-size="14" font-weight="700">🕹️ 2. PRIMARY FLIGHT CONTROL &amp; NAVIGATION</text>

    <!-- CUAV V6X Autopilot Core -->
    <g transform="translate(16, 50)">
      <rect width="368" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="14" y="24" fill="#38bdf8" font-size="14" font-weight="700">CUAV V6X Autopilot (ArduCopter v4.6.3)</text>
      <text x="14" y="42" fill="#cbd5e1" font-size="11">STM32H753 (480 MHz) • Triple Redundant IMU • Dual Baro • EKF3</text>
    </g>

    <!-- Sub-modules row -->
    <g transform="translate(16, 122)">
      <!-- GPS -->
      <g transform="translate(0, 0)">
        <rect width="116" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="8" y="18" fill="#f8fafc" font-size="10" font-weight="600">CUAV NEO V3</text>
        <text x="8" y="32" fill="#94a3b8" font-size="9">u-blox M9N GNSS</text>
        <text x="8" y="44" fill="#38bdf8" font-size="8">UART1 + I2C</text>
      </g>
      <!-- RC Receiver -->
      <g transform="translate(126, 0)">
        <rect width="116" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="8" y="18" fill="#f8fafc" font-size="10" font-weight="600">RadioMaster RP3</text>
        <text x="8" y="32" fill="#94a3b8" font-size="9">ELRS 2.4G Diversity</text>
        <text x="8" y="44" fill="#a855f7" font-size="8">CRSF (416 kbaud)</text>
      </g>
      <!-- ESP32 -->
      <g transform="translate(252, 0)">
        <rect width="116" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="8" y="18" fill="#f8fafc" font-size="10" font-weight="600">ESP32 Subsystem</text>
        <text x="8" y="32" fill="#94a3b8" font-size="9">Wi-Fi/BLE Bridge</text>
        <text x="8" y="44" fill="#38bdf8" font-size="8">UART7 (115.2k)</text>
      </g>
    </g>

    <!-- Status footer -->
    <text x="16" y="200" fill="#94a3b8" font-size="10">Telemetry Ports: SERIAL5 (RPi 921.6k) • SERIAL2 (LiDAR) • DroneCAN (PMU)</text>
    <text x="16" y="216" fill="#38bdf8" font-size="10">Failsafe: Auto Land on PrecLand Target • RTL on Battery/RF Loss</text>
  </g>

  <!-- ======================================================== -->
  <!-- 4. PROPULSION & SPEED CONTROL                            -->
  <!-- ======================================================== -->
  <g transform="translate(840, 95)" filter="url(#cardShadow)">
    <rect width="320" height="230" rx="10" fill="url(#propGrad)" stroke="#059669" stroke-width="1.5"/>
    <rect width="320" height="36" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="16" y="24" fill="#6ee7b7" font-size="14" font-weight="700">🚀 4. PROPULSION &amp; SPEED CONTROL</text>

    <!-- Dual 4-in-1 ESCs -->
    <g transform="translate(16, 50)">
      <rect width="138" height="58" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="8" y="20" fill="#6ee7b7" font-size="11" font-weight="700">BotLab 55A ESC #1</text>
      <text x="8" y="36" fill="#f8fafc" font-size="10">Motors 1, 2, 3 (Right)</text>
      <text x="8" y="49" fill="#94a3b8" font-size="9">DShot600 (AM32)</text>
    </g>

    <g transform="translate(166, 50)">
      <rect width="138" height="58" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="8" y="20" fill="#6ee7b7" font-size="11" font-weight="700">BotLab 55A ESC #2</text>
      <text x="8" y="36" fill="#f8fafc" font-size="10">Motors 4, 5, 6 (Left)</text>
      <text x="8" y="49" fill="#94a3b8" font-size="9">DShot600 (AM32)</text>
    </g>

    <!-- Motor & Props -->
    <g transform="translate(16, 120)">
      <rect width="288" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="22" fill="#f8fafc" font-size="11" font-weight="600">6 × T-Motor MN4110 (KV400)</text>
      <text x="10" y="38" fill="#94a3b8" font-size="10">16 × 5.5" Carbon Fiber Direct-Mount Propellers (3 CW / 3 CCW)</text>
    </g>

    <text x="16" y="196" fill="#94a3b8" font-size="10">Thrust: ~2.4 kg/rotor @ Max • Hover Load: ~1.75 kg/rotor</text>
    <text x="16" y="212" fill="#6ee7b7" font-size="10">Wheelbase: 780mm – 950mm Payload Frame X</text>
  </g>

  <!-- ======================================================== -->
  <!-- 3. COMPANION COMPUTE, VISION & EDGE AI                   -->
  <!-- ======================================================== -->
  <g transform="translate(40, 470)" filter="url(#cardShadow)">
    <rect width="760" height="255" rx="10" fill="url(#rpiGrad)" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="760" height="36" rx="10" fill="#7c3aed" fill-opacity="0.25"/>
    <text x="16" y="24" fill="#c4b5fd" font-size="14" font-weight="700">🧠 3. COMPANION COMPUTE, VISION &amp; EDGE AI</text>

    <!-- Raspberry Pi 5 Core -->
    <g transform="translate(16, 48)">
      <rect width="728" height="54" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
      <text x="16" y="24" fill="#c4b5fd" font-size="14" font-weight="700">Raspberry Pi 5 (8GB RAM) — Ubuntu Linux 64-bit / ROS 2</text>
      <text x="16" y="42" fill="#cbd5e1" font-size="11">MAVLink Router • Precision Landing Engine • MediaMTX RTSP Server • Firebase Dispatcher • Edge Vision</text>
    </g>

    <!-- Sensor / Peripheral Row -->
    <g transform="translate(16, 114)">
      <!-- Arducam 64MP OwlSight -->
      <g transform="translate(0, 0)">
        <rect width="170" height="66" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
        <text x="8" y="18" fill="#e9d5ff" font-size="11" font-weight="700">Arducam 64MP OwlSight</text>
        <text x="8" y="32" fill="#94a3b8" font-size="9">OmniVision OV64A40 (MIPI CSI)</text>
        <text x="8" y="46" fill="#c4b5fd" font-size="9">Motorized VCM Focus (Step 160)</text>
        <text x="8" y="58" fill="#38bdf8" font-size="8">720p 120 FPS / 64MP Stills</text>
      </g>

      <!-- Waveshare OV9281 Mono -->
      <g transform="translate(182, 0)">
        <rect width="170" height="66" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="8" y="18" fill="#f8fafc" font-size="11" font-weight="600">Waveshare OV9281 Mono</text>
        <text x="8" y="32" fill="#94a3b8" font-size="9">1MP Global Shutter (USB 3.0)</text>
        <text x="8" y="46" fill="#cbd5e1" font-size="9">1280×800 @ 120 FPS</text>
        <text x="8" y="58" fill="#34d399" font-size="8">High-Speed Optical Flow</text>
      </g>

      <!-- 5GHz Wireless Link -->
      <g transform="translate(364, 0)">
        <rect width="180" height="66" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="8" y="18" fill="#7dd3fc" font-size="11" font-weight="700">BL-M8812EU2 5GHz Link</text>
        <text x="8" y="32" fill="#94a3b8" font-size="9">RTL8812EU (800mW / 29dBm)</text>
        <text x="8" y="46" fill="#cbd5e1" font-size="9">Low-Latency RTSP / WFB-ng</text>
        <text x="8" y="58" fill="#38bdf8" font-size="8">2T2R MIMO (USB 2.0 High-Power)</text>
      </g>

      <!-- 4G LTE Modem -->
      <g transform="translate(556, 0)">
        <rect width="172" height="66" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="8" y="18" fill="#f8fafc" font-size="11" font-weight="600">CAPUF EC200U 4G LTE</text>
        <text x="8" y="32" fill="#94a3b8" font-size="9">Quectel Cat 1 Modem + GNSS</text>
        <text x="8" y="46" fill="#cbd5e1" font-size="9">BVLOS Cloud Telemetry</text>
        <text x="8" y="58" fill="#e2e8f0" font-size="8">ZeroTier VPN / RTDB Sync</text>
      </g>
    </g>

    <!-- Bottom utility line -->
    <g transform="translate(16, 192)">
      <rect width="230" height="36" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="22" fill="#94a3b8" font-size="10">Benewake TF-Luna LiDAR (UART)</text>
    </g>
    <g transform="translate(260, 192)">
      <rect width="230" height="36" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="22" fill="#94a3b8" font-size="10">500 mAh UPS Buffer Battery (NVMe Shield)</text>
    </g>
    <g transform="translate(504, 192)">
      <rect width="240" height="36" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="22" fill="#94a3b8" font-size="10">Piezo Buzzer / Speaker Beacon (GPIO)</text>
    </g>

    <text x="16" y="244" fill="#a78bfa" font-size="10">Companion Power: 5.0V @ 7.0A from Dedicated UBEC • Real-time RTSP Feed: rtsp://127.0.0.1:8554/cam</text>
  </g>

  <!-- ======================================================== -->
  <!-- 5. ROBOTIC ACTUATION & PAYLOAD MECHANISM                 -->
  <!-- ======================================================== -->
  <g transform="translate(840, 470)" filter="url(#cardShadow)">
    <rect width="320" height="255" rx="10" fill="url(#actGrad)" stroke="#db2777" stroke-width="1.5"/>
    <rect width="320" height="36" rx="10" fill="#db2777" fill-opacity="0.25"/>
    <text x="16" y="24" fill="#f472b6" font-size="14" font-weight="700">🦾 5. ROBOTIC ACTUATION &amp; PAYLOAD</text>

    <!-- Waveshare Servo Driver -->
    <g transform="translate(16, 50)">
      <rect width="288" height="54" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
      <text x="10" y="22" fill="#f472b6" font-size="12" font-weight="700">Waveshare Serial Bus Servo Driver</text>
      <text x="10" y="38" fill="#cbd5e1" font-size="10">UART / USB Control from RPi 5 • 7.0V Servo Bus Rail</text>
    </g>

    <!-- Servos -->
    <g transform="translate(16, 116)">
      <rect width="288" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" fill="#f8fafc" font-size="11" font-weight="600">ST3215 High-Torque Servo (30 kg·cm)</text>
      <text x="10" y="36" fill="#94a3b8" font-size="10">Heavy Cargo Release Latch / Winch Mechanism</text>
    </g>

    <g transform="translate(16, 176)">
      <rect width="288" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" fill="#f8fafc" font-size="11" font-weight="600">2 × SC09 Micro Servos (2.3 kg·cm)</text>
      <text x="10" y="36" fill="#94a3b8" font-size="10">Robotic Gripper Claw (Jaws A &amp; B Articulation)</text>
    </g>

    <text x="16" y="244" fill="#f472b6" font-size="10">Powered by XL4005 Step-Down Buck Converter (7.0V @ 5A)</text>
  </g>

  <!-- ======================================================== -->
  <!-- INTERCONNECT ARROWS & SIGNAL BUSES                       -->
  <!-- ======================================================== -->
  <!-- 1. PMU -> CUAV V6X (5.2V Power + DroneCAN) -->
  <path d="M 360 270 L 400 210" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <rect x="362" y="230" width="70" height="18" rx="3" fill="#090d16" stroke="#f97316" stroke-width="0.8"/>
  <text x="366" y="243" fill="#fdba74" font-size="9" font-weight="600">5.2V + CAN</text>

  <!-- 2. PMU -> ESCs (22.2V Main Bus) -->
  <path d="M 360 200 C 600 80, 800 80, 840 180" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <rect x="560" y="72" width="120" height="18" rx="3" fill="#090d16" stroke="#f97316" stroke-width="0.8"/>
  <text x="566" y="85" fill="#fdba74" font-size="9" font-weight="600">22.2V DC Main Bus</text>

  <!-- 3. CUAV V6X <-> Raspberry Pi 5 (MAVLink 2 921.6k) -->
  <path d="M 580 325 L 580 470" fill="none" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M 590 470 L 590 325" fill="none" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <rect x="520" y="385" width="150" height="22" rx="4" fill="#090d16" stroke="#a855f7" stroke-width="1"/>
  <text x="528" y="400" fill="#c4b5fd" font-size="10" font-weight="700">MAVLink 2 (921,600 baud)</text>

  <!-- 4. CUAV V6X -> ESCs (DShot600 M1-M6) -->
  <path d="M 800 200 L 840 200" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="785" y="176" width="68" height="18" rx="3" fill="#090d16" stroke="#34d399" stroke-width="0.8"/>
  <text x="789" y="189" fill="#6ee7b7" font-size="9" font-weight="600">DShot600</text>

  <!-- 5. UBEC -> RPi 5 (5.0V Logic) -->
  <path d="M 120 435 L 120 470" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="75" y="442" width="90" height="18" rx="3" fill="#090d16" stroke="#f97316" stroke-width="0.8"/>
  <text x="80" y="455" fill="#fdba74" font-size="9" font-weight="600">5.0V @ 7.0A DC</text>

  <!-- 6. XL4005 -> Servo Driver (7.0V Servo Rail) -->
  <path d="M 235 435 C 235 460, 860 450, 860 470" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="420" y="446" width="95" height="18" rx="3" fill="#090d16" stroke="#f97316" stroke-width="0.8"/>
  <text x="425" y="459" fill="#fdba74" font-size="9" font-weight="600">7.0V @ 5.0A DC</text>

  <!-- 7. RPi 5 -> Servo Driver (USB/UART Control) -->
  <path d="M 800 580 L 840 580" fill="none" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrow-pink)"/>
  <rect x="785" y="556" width="70" height="18" rx="3" fill="#090d16" stroke="#f472b6" stroke-width="0.8"/>
  <text x="789" y="569" fill="#f472b6" font-size="9" font-weight="600">USB / UART</text>
</svg>
